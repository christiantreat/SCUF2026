<title>Ocular POCUS Simulator</title>
<style>
  :root {
    --void: #06060c;
    --surface: #0e0e1a;
    --raised: #16162a;
    --border: #262642;
    --text: #b0b8c4;
    --bright: #dce0e8;
    --muted: #4e5668;
    --norm: #5a9a6a;
    --vh: #d48a2e;
    --rd: #2ea8cc;
    --accent: #3c7eaa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--void);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  header{text-align:center;padding:20px 14px 2px;width:100%;max-width:640px}
  header h1{
    font-size:clamp(14px,2.8vw,20px);font-weight:700;color:var(--bright);
    letter-spacing:1px;text-transform:uppercase;
  }
  header .sub{font-size:clamp(10px,1.6vw,12px);color:var(--muted);margin-top:2px;letter-spacing:.3px}

  .toolbar{
    width:100%;max-width:640px;padding:10px 12px 4px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
  }
  .modes{display:flex;gap:5px;flex-wrap:wrap}
  .mbtn{
    padding:7px 12px;background:var(--raised);border:1px solid var(--border);
    border-radius:4px;color:var(--text);font-size:11px;font-weight:700;
    cursor:pointer;text-transform:uppercase;letter-spacing:.7px;
    transition:background .12s,color .12s,border-color .12s;
    font-family:inherit;border-top:2px solid transparent;
    min-height:34px;
  }
  .mbtn:hover{background:#1e1e38}
  .mbtn.on[data-m="normal"]{color:var(--norm);border-top-color:var(--norm);background:#0e1a14}
  .mbtn.on[data-m="vh"]{color:var(--vh);border-top-color:var(--vh);background:#1a1408}
  .mbtn.on[data-m="rd"]{color:var(--rd);border-top-color:var(--rd);background:#0a1820}
  .gain-grp{display:flex;align-items:center;gap:8px}
  .gain-grp label{
    font-size:10px;font-weight:700;color:var(--accent);
    text-transform:uppercase;letter-spacing:1.4px;
  }
  .gain-grp input[type="range"]{
    -webkit-appearance:none;appearance:none;width:clamp(100px,16vw,180px);
    height:5px;background:var(--raised);border-radius:3px;outline:none;
    cursor:pointer;border:1px solid var(--border);
  }
  .gain-grp input::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bright);cursor:pointer;
  }
  .gain-grp input::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bright);cursor:pointer;
  }
  .gain-db{
    font-family:'SF Mono','Cascadia Mono',Consolas,monospace;
    font-size:13px;font-weight:700;color:var(--accent);
    min-width:40px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .gain-db i{font-style:normal;font-size:9px;font-weight:400;color:var(--muted);margin-left:1px}

  .display{
    width:100%;max-width:640px;padding:4px 12px;
  }
  .screen{
    position:relative;width:100%;aspect-ratio:1;
    cursor:ew-resize;touch-action:none;
    background:#000;border-radius:6px;overflow:hidden;
    border:1px solid var(--border);
  }
  .screen canvas{width:100%;height:100%;display:block}

  .hint{
    width:100%;max-width:640px;padding:6px 14px 0;
    text-align:center;font-size:11px;font-weight:600;
    min-height:18px;transition:color .2s;color:var(--muted);
    line-height:1.45;
  }

  .teach{
    width:100%;max-width:640px;padding:6px 12px 4px;
  }
  .teach-box{
    background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:10px 16px;
  }
  .teach-box h3{
    font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:1.2px;margin-bottom:5px;
  }
  .teach-box ul{list-style:none}
  .teach-box li{
    font-size:12px;color:var(--text);line-height:1.5;
    padding-left:13px;position:relative;margin-bottom:1px;
  }
  .teach-box li::before{
    content:'';position:absolute;left:0;top:7px;
    width:5px;height:5px;border-radius:50%;opacity:.45;
  }

  .foot{
    width:100%;max-width:640px;text-align:center;
    padding:6px 12px 22px;
  }
  .foot span{
    display:inline-block;font-size:10px;color:var(--muted);
    background:var(--raised);border:1px solid var(--border);
    border-radius:4px;padding:4px 10px;margin:2px;letter-spacing:.2px;
  }

  @media(max-width:420px){
    .toolbar{flex-direction:column;align-items:stretch}
    .modes{justify-content:center}
    .gain-grp{justify-content:center}
  }
</style>

<header>
  <h1>Point-of-Care Ocular Ultrasound</h1>
  <div class="sub">Drag to sweep &bull; Toggle pathology &bull; Adjust gain</div>
</header>

<div class="toolbar">
  <div class="modes">
    <button class="mbtn on" data-m="normal">Normal</button>
    <button class="mbtn" data-m="vh">Vitreous Hemorrhage</button>
    <button class="mbtn" data-m="rd">Retinal Detachment</button>
  </div>
  <div class="gain-grp">
    <label>Gain</label>
    <input type="range" id="gain" min="10" max="95" value="25">
    <div class="gain-db" id="gDisp">25<i>dB</i></div>
  </div>
</div>

<div class="display">
  <div class="screen" id="scr">
    <canvas id="cv"></canvas>
  </div>
</div>

<div class="hint" id="hint"></div>

<div class="teach">
  <div class="teach-box" id="teachBox"></div>
</div>

<div class="foot">
  <span>Drag left / right to fan the probe</span>
  <span>Runs offline &mdash; no install needed</span>
  <span>For educational use only</span>
</div>

<script>
(function(){
'use strict';
var R=600;
var cv=document.getElementById('cv');
cv.width=cv.height=R;
var ctx=cv.getContext('2d');
var gainEl=document.getElementById('gain');
var gDisp=document.getElementById('gDisp');
var hintEl=document.getElementById('hint');
var teachBox=document.getElementById('teachBox');
var btns=document.querySelectorAll('.mbtn');

var mode='normal', gain=25, sweep=0, t=0;

/* --- seeded RNG --- */
function sr(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}

/* --- VH particles --- */
var NP=400,parts=[],rng=sr(42);
for(var i=0;i<NP;i++){
  var a=rng()*6.283,rr=Math.pow(rng(),.55)*.86;
  parts.push({
    x:Math.cos(a)*rr,y:Math.sin(a)*rr,
    sz:.7+rng()*2.6,br:.2+rng()*.8,
    thr:16+rng()*58,ph:rng()*6.28,
    dr:(rng()-.5)*.014
  });
}
parts.sort(function(a,b){return a.y-b.y});

/* --- noise texture --- */
var nCv=document.createElement('canvas');
nCv.width=nCv.height=R;
var nCtx=nCv.getContext('2d');
var nD=nCtx.createImageData(R,R),nr=sr(777);
for(var j=0;j<nD.data.length;j+=4){
  var v=Math.floor(nr()*32);
  nD.data[j]=nD.data[j+1]=nD.data[j+2]=v;nD.data[j+3]=26;
}
nCtx.putImageData(nD,0,0);

/* --- constants --- */
var PY=10,SA=.74,MONO="'SF Mono','Cascadia Mono',Consolas,monospace";
var GR=R*.23,GY=R*.47;

/* --- drawing --- */

function clip(){
  ctx.beginPath();
  ctx.moveTo(R/2,PY);
  ctx.arc(R/2,PY,R-26,Math.PI/2-SA,Math.PI/2+SA);
  ctx.closePath();
}

function tissue(gn){
  var sr2=R-26,g=ctx.createRadialGradient(R/2,PY,8,R/2,PY,sr2);
  var b=Math.floor(5+gn*20);
  g.addColorStop(0,'rgb('+(b+4)+','+(b+4)+','+(b+6)+')');
  g.addColorStop(.3,'rgb('+(b+2)+','+(b+2)+','+(b+4)+')');
  g.addColorStop(.7,'rgb('+b+','+b+','+(b+1)+')');
  g.addColorStop(1,'rgb('+Math.floor(b*.45)+','+Math.floor(b*.45)+','+Math.floor(b*.55)+')');
  ctx.fillStyle=g;ctx.fill();
}

function lines(gn){
  ctx.strokeStyle='rgba(70,90,120,'+(0.014+gn*.01)+')';
  ctx.lineWidth=.4;
  for(var a=-SA;a<=SA;a+=.02){
    ctx.beginPath();ctx.moveTo(R/2,PY);
    ctx.lineTo(R/2+Math.sin(a)*(R-26),PY+Math.cos(a)*(R-26));
    ctx.stroke();
  }
}

function opticNerve(cx,cy,r,gn){
  var nw=11,nx=cx,ny=cy+r;
  // Nerve (hypoechoic column)
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.beginPath();
  ctx.moveTo(nx-nw,ny);ctx.lineTo(nx+nw,ny);
  ctx.lineTo(nx+nw+3,ny+100);ctx.lineTo(nx-nw-3,ny+100);
  ctx.closePath();ctx.fill();
  // Sheath borders (bright)
  var sb=Math.floor(55+gn*110);sb=Math.min(255,sb);
  ctx.strokeStyle='rgba('+sb+','+sb+','+Math.min(255,Math.floor(sb*1.05))+',0.7)';
  ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(nx-nw,ny+2);ctx.lineTo(nx-nw-3,ny+80);ctx.stroke();
  ctx.beginPath();ctx.moveTo(nx+nw,ny+2);ctx.lineTo(nx+nw+3,ny+80);ctx.stroke();
  // ONSD measurement markers
  var my=ny+16;
  ctx.strokeStyle='rgba('+sb+','+sb+','+sb+',.35)';
  ctx.lineWidth=1;
  ctx.setLineDash([2,2]);
  ctx.beginPath();ctx.moveTo(nx-nw-5,my);ctx.lineTo(nx+nw+5,my);ctx.stroke();
  ctx.setLineDash([]);
}

function postEnhance(cx,cy,r,gn){
  var eb=Math.floor(10+gn*28);
  ctx.fillStyle='rgba('+eb+','+eb+','+(eb+3)+',0.3)';
  ctx.beginPath();
  ctx.moveTo(cx-r*.65,cy+r);ctx.lineTo(cx+r*.65,cy+r);
  ctx.lineTo(cx+r*.75,cy+r+130);ctx.lineTo(cx-r*.75,cy+r+130);
  ctx.closePath();ctx.fill();
}

function drawGlobe(sw,gn){
  // Depth-dependent parallax: deeper structures shift less
  var shiftScale=sw*12;
  var cx=R/2+shiftScale;
  var cy=GY;
  var r=GR;

  // Posterior acoustic enhancement
  postEnhance(cx*.97+R*.015,cy,r,gn);

  // Optic nerve (behind globe)
  opticNerve(cx*.96+R*.02,cy,r,gn);

  // Sclera (outer ring)
  var sB=Math.floor(35+gn*65);sB=Math.min(255,sB);
  ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);
  ctx.strokeStyle='rgba('+sB+','+sB+','+Math.floor(sB*1.05)+',0.2)';
  ctx.lineWidth=4;ctx.stroke();

  // Vitreous (anechoic fill)
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  var vg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  var vb=Math.floor(1+gn*3);
  vg.addColorStop(0,'rgb('+vb+','+vb+','+(vb+1)+')');
  vg.addColorStop(.88,'rgb('+(vb+1)+','+(vb+1)+','+(vb+1)+')');
  vg.addColorStop(1,'rgb('+(vb+2)+','+(vb+2)+','+(vb+3)+')');
  ctx.fillStyle=vg;ctx.fill();

  // Posterior wall (retina + choroid + sclera)
  var wB=Math.floor(85+gn*165);wB=Math.min(255,wB);
  // Outer layer (sclera) — brightest, thickest
  ctx.beginPath();ctx.arc(cx,cy,r+1,Math.PI*.1,Math.PI*.9);
  ctx.strokeStyle='rgb('+wB+','+wB+','+Math.min(255,Math.floor(wB*1.03))+')';
  ctx.lineWidth=4;ctx.stroke();
  // Inner layer (retina/choroid) — slightly dimmer, thinner
  var iB=Math.floor(wB*.7);
  ctx.beginPath();ctx.arc(cx,cy,r-3,Math.PI*.13,Math.PI*.87);
  ctx.strokeStyle='rgba('+iB+','+iB+','+iB+',0.5)';
  ctx.lineWidth=1.5;ctx.stroke();
  // Glow
  ctx.beginPath();ctx.arc(cx,cy,r+3,Math.PI*.15,Math.PI*.85);
  ctx.strokeStyle='rgba('+wB+','+wB+','+wB+',0.15)';
  ctx.lineWidth=12;ctx.stroke();

  // Lens — biconvex: anterior capsule + posterior capsule
  var lB=Math.floor(60+gn*130);lB=Math.min(255,lB);
  var lensY=cy-r+8;
  var lensW=r*.42;
  var lensH=r*.16;
  // Anterior capsule (upper bright arc)
  ctx.beginPath();
  ctx.ellipse(cx,lensY-lensH*.3,lensW,lensH*.45,0,Math.PI,Math.PI*2);
  ctx.strokeStyle='rgb('+lB+','+lB+','+lB+')';
  ctx.lineWidth=2;ctx.stroke();
  // Posterior capsule (lower bright arc — slightly more curved)
  ctx.beginPath();
  ctx.ellipse(cx,lensY+lensH*.3,lensW*.95,lensH*.55,0,0,Math.PI);
  ctx.strokeStyle='rgb('+Math.floor(lB*.9)+','+Math.floor(lB*.9)+','+Math.floor(lB*.9)+')';
  ctx.lineWidth=1.8;ctx.stroke();
  // Lens substance fill (relatively anechoic between capsules)
  ctx.beginPath();
  ctx.ellipse(cx,lensY,lensW*.9,lensH*.4,0,0,Math.PI*2);
  ctx.fillStyle='rgba('+Math.floor(vb*1.5)+','+Math.floor(vb*1.5)+','+Math.floor(vb*1.5)+',0.6)';
  ctx.fill();

  // Eyelid / cornea (thin bright line at very top within sector)
  var lidB=Math.floor(40+gn*80);lidB=Math.min(255,lidB);
  var lidY=PY+28;
  ctx.beginPath();
  ctx.moveTo(cx-r*.7,lidY);
  ctx.quadraticCurveTo(cx,lidY-4,cx+r*.7,lidY);
  ctx.strokeStyle='rgba('+lidB+','+lidB+','+lidB+',0.5)';
  ctx.lineWidth=2;ctx.stroke();

  return{cx:cx,cy:cy,r:r};
}

function drawVH(g,gn,sw,tt){
  var cx=g.cx,cy=g.cy,r=g.r,gl=gain;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(gl<p.thr)continue;
    var vis=Math.min(1,(gl-p.thr)/14);
    var px=cx+(p.x+Math.sin(tt*.35+p.ph)*.016+sw*.13*p.br)*r;
    var py=cy+(p.y+Math.cos(tt*.22+p.ph)*.01+p.dr*Math.sin(tt*.15))*r;
    var dx=px-cx,dy=py-cy;
    if(dx*dx+dy*dy>r*r*.82)continue;
    var bv=Math.floor(p.br*vis*(.35+gn*.65)*230);bv=Math.min(255,bv);
    ctx.fillStyle='rgba('+Math.min(255,bv+12)+','+Math.min(255,bv+6)+','+bv+','+(vis*.88)+')';
    ctx.beginPath();ctx.arc(px,py,p.sz*(.65+gn*.5),0,Math.PI*2);ctx.fill();
  }
  // Strands
  if(gl>42){
    var sa2=Math.min(.5,(gl-42)/65);
    ctx.strokeStyle='rgba('+Math.floor(65+gn*85)+','+Math.floor(55+gn*65)+','+Math.floor(45+gn*45)+','+sa2+')';
    ctx.lineWidth=1;
    for(var s=0;s<7;s++){
      var sr3=sr(s*131+Math.floor(sw*2.2));
      ctx.beginPath();
      var sx=cx+(sr3()-.5)*r*1.2,sy=cy+(sr3()-.5)*r*1.1;
      var dd=(sx-cx)*(sx-cx)+(sy-cy)*(sy-cy);
      if(dd>r*r*.7)continue;
      ctx.moveTo(sx,sy);
      for(var sg=0;sg<4;sg++){sx+=(sr3()-.5)*26;sy+=(sr3()-.5)*26;ctx.lineTo(sx,sy)}
      ctx.stroke();
    }
  }
  // Dense clumps
  if(gl>68){
    var ca=(gl-68)/54;
    for(var c=0;c<10;c++){
      var cr3=sr(c*47+211);
      var ccx=cx+(cr3()-.5)*r*1.1,ccy=cy+(cr3()-.5)*r*.9+r*.12;
      dd=(ccx-cx)*(ccx-cx)+(ccy-cy)*(ccy-cy);
      if(dd>r*r*.65)continue;
      var csz=3+cr3()*7;
      var cb=Math.floor((35+gn*75)*ca);
      ctx.fillStyle='rgba('+cb+','+Math.floor(cb*.82)+','+Math.floor(cb*.6)+','+(ca*.45)+')';
      ctx.beginPath();ctx.arc(ccx+Math.sin(tt*.28+c)*2.5,ccy,csz,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawRD(g,gn,sw,tt){
  var cx=g.cx,cy=g.cy,r=g.r;
  // Membrane brightness: nearly constant — strong reflector
  var mb=Math.min(255,195+gn*35);
  var dX=cx,dY=cy+r*.8;
  var sp=.5+Math.abs(sw)*.04;
  var tl=sw*.065;
  var aL=r*(1.18+Math.sin(tt*.1)*.02);
  var lA=-Math.PI/2-sp+tl,rA=-Math.PI/2+sp+tl;

  ctx.save();
  ctx.shadowColor='rgba('+mb+','+mb+','+Math.floor(mb*.9)+',0.4)';
  ctx.shadowBlur=16;
  ctx.strokeStyle='rgb('+mb+','+mb+','+Math.min(255,Math.floor(mb*1.02))+')';
  ctx.lineWidth=4;ctx.lineCap='round';

  // Left arm
  var lCx=dX+Math.cos(lA)*aL*.5+Math.sin(tt*.16+1)*2;
  var lCy=dY+Math.sin(lA)*aL*.5;
  var lEx=dX+Math.cos(lA)*aL;
  var lEy=dY+Math.sin(lA)*aL;
  ctx.beginPath();ctx.moveTo(dX,dY);ctx.quadraticCurveTo(lCx,lCy,lEx,lEy);ctx.stroke();

  // Right arm
  var rCx=dX+Math.cos(rA)*aL*.5+Math.sin(tt*.16)*2;
  var rCy=dY+Math.sin(rA)*aL*.5;
  var rEx=dX+Math.cos(rA)*aL;
  var rEy=dY+Math.sin(rA)*aL;
  ctx.beginPath();ctx.moveTo(dX,dY);ctx.quadraticCurveTo(rCx,rCy,rEx,rEy);ctx.stroke();

  // Sail
  ctx.lineWidth=2.5;
  var mX=(lEx+rEx)/2,mY=Math.min(lEy,rEy)-r*.07;
  ctx.beginPath();ctx.moveTo(lEx,lEy);ctx.quadraticCurveTo(mX,mY,rEx,rEy);ctx.stroke();
  ctx.restore();

  // Disc marker
  ctx.beginPath();ctx.arc(dX,dY,3.5,0,Math.PI*2);
  ctx.fillStyle='rgb('+mb+','+mb+','+mb+')';ctx.fill();
}

function labels(g,md,gn){
  var cx=g.cx,cy=g.cy,r=g.r;
  var lb=Math.floor(50+gn*50);lb=Math.min(180,lb);
  var c='rgba('+lb+','+Math.floor(lb*1.15)+','+Math.floor(lb*1.3)+',0.55)';
  ctx.fillStyle=c;
  ctx.font='9px '+MONO;
  ctx.textAlign='center';

  // Lens
  ctx.fillText('LENS',cx,cy-r+30);
  // Vitreous
  if(md==='normal') ctx.fillText('VITREOUS',cx,cy+4);
  // Posterior wall
  ctx.fillText('POST. WALL',cx,cy+r+16);
  // Optic nerve
  ctx.fillText('ON',cx*.96+R*.02,cy+r+42);

  if(md==='vh'&&gain>35){
    ctx.fillStyle='rgba('+Math.floor(180+gn*50)+','+Math.floor(120+gn*30)+',40,.55)';
    ctx.fillText('HEMORRHAGE',cx,cy+4);
  }
  if(md==='rd'){
    ctx.fillStyle='rgba(40,'+Math.floor(140+gn*40)+','+Math.floor(170+gn*50)+',.55)';
    ctx.fillText('DETACHED RETINA',cx,cy-r*.25);
    ctx.font='8px '+MONO;
    ctx.fillText('TETHERED',cx,cy+r*.8+14);
  }
}

function machineOvr(md){
  ctx.fillStyle='rgba(70,100,130,.4)';
  ctx.font='9px '+MONO;
  ctx.textAlign='right';
  ctx.fillText('10 MHz LINEAR',R-8,R-28);
  ctx.fillText('MI 0.23  TIs 0.4',R-8,R-18);
  ctx.fillText('GAIN '+gain+' dB',R-8,R-8);

  ctx.textAlign='left';
  var nm=md==='normal'?'NORMAL':md==='vh'?'VITREOUS HEMORRHAGE':'RETINAL DETACHMENT';
  ctx.fillText(nm,8,R-8);

  // Live indicator
  ctx.fillStyle='rgba(80,190,90,.65)';
  ctx.font='bold 9px '+MONO;
  ctx.fillText('LIVE',8,18);

  // Patient label
  ctx.fillStyle='rgba(70,100,130,.4)';
  ctx.font='9px '+MONO;
  ctx.textAlign='right';
  ctx.fillText('OCULAR R',R-8,18);
}

function depthM(){
  ctx.strokeStyle='rgba(70,100,130,.18)';
  ctx.fillStyle='rgba(70,100,130,.35)';
  ctx.font='8px '+MONO;ctx.textAlign='left';ctx.lineWidth=.8;
  var sL=R-36;
  [1,2,3,4].forEach(function(d){
    var yy=PY+(d/4.5)*sL;
    var tx=R/2-Math.tan(SA)*(yy-PY)+3;
    ctx.beginPath();ctx.moveTo(tx,yy);ctx.lineTo(tx+6,yy);ctx.stroke();
    ctx.fillText(d+'cm',tx-6,yy-2);
  });
}

function probe(sw){
  var px=R/2,py=6,ag=sw*.05;
  ctx.save();ctx.translate(px,py);ctx.rotate(ag);
  ctx.fillStyle='#2a3240';ctx.fillRect(-10,-3,20,7);
  ctx.fillStyle='#4e80a8';ctx.fillRect(-6,3,12,2);
  ctx.restore();
}

function spk(gn){
  ctx.globalAlpha=.1+gn*.14;
  ctx.drawImage(nCv,0,0);
  ctx.globalAlpha=1;
}

/* --- main render --- */
function render(){
  var gn=(gain-10)/85;
  ctx.clearRect(0,0,R,R);
  ctx.fillStyle='#000';ctx.fillRect(0,0,R,R);

  ctx.save();
  clip();ctx.clip();
  tissue(gn);
  lines(gn);
  var g=drawGlobe(sweep,gn);
  if(mode==='vh')drawVH(g,gn,sweep,t);
  else if(mode==='rd')drawRD(g,gn,sweep,t);
  spk(gn);
  ctx.restore();

  labels(g,mode,gn);
  depthM();
  probe(sweep);
  machineOvr(mode);
}

/* --- hints --- */
var hints={
  normal:[
    [28,'Normal globe at baseline gain. Anechoic vitreous, intact posterior wall.'],
    [50,'Moderate gain. Normal anatomy clear. Vitreous remains echo-free.'],
    [72,'Higher gain. Background noise increases but vitreous stays clean.'],
    [999,'Maximum gain on normal eye. The noise is artifact, not pathology. Switch to VH to compare.']
  ],
  vh:[
    [26,'Low gain — vitreous appears nearly clear. Hemorrhage is below the detection threshold.'],
    [46,'Moderate gain — hemorrhage particles appearing. Note: they float freely, not tethered.'],
    [70,'Higher gain — vitreous filling with echogenic debris. The snowstorm of hemorrhage.'],
    [999,'Dense hemorrhage. Switch to Normal at this same gain to see the difference.']
  ],
  rd:[
    [26,'Minimum gain — the detached retina is already clearly visible. Gain-independent.'],
    [46,'Moderate gain — membrane unchanged. A strong reflector that doesn’t need gain.'],
    [70,'Higher gain — noise increases but the membrane looks the same as at low gain.'],
    [999,'Maximum gain — noise everywhere, but the tethered membrane is no brighter than at minimum.']
  ]
};
var hintColors={normal:'#5a9a6a',vh:'#c09030',rd:'#4a9aba'};

function updateHint(){
  var h=hints[mode];
  for(var i=0;i<h.length;i++){
    if(gain<h[i][0]){hintEl.textContent=h[i][1];break}
  }
  hintEl.style.color=hintColors[mode];
}

/* --- teaching content --- */
var teachData={
  normal:{
    title:'Normal Globe',
    color:'var(--norm)',
    items:[
      'Anechoic vitreous — no internal echoes at appropriate gain',
      'Intact posterior wall: retina + choroid + sclera',
      'Biconvex lens with echogenic anterior and posterior capsules',
      'Optic nerve and sheath visible posteriorly (ONSD measurement site)'
    ]
  },
  vh:{
    title:'Vitreous Hemorrhage',
    color:'var(--vh)',
    items:[
      'Echogenic particles appear and multiply as gain increases',
      'Free-floating — not tethered to any structure',
      'Shift and swirl when you fan the probe (kinetic echoes)',
      'At low gain the vitreous may appear falsely clear — always check at higher gain'
    ]
  },
  rd:{
    title:'Retinal Detachment',
    color:'var(--rd)',
    items:[
      'Bright undulating membrane within the vitreous cavity',
      'Anchored at the optic disc — classic tethered V-shape',
      'Visible even at minimum gain (gain-independent strong reflector)',
      'Stays fixed when you sweep — only the viewing angle changes'
    ]
  }
};

function updateTeach(){
  var d=teachData[mode];
  var h='<h3 style="color:'+d.color+'">'+d.title+'</h3><ul>';
  d.items.forEach(function(it){
    h+='<li style="--c:'+d.color+'">'+it+'</li>';
  });
  h+='</ul>';
  teachBox.innerHTML=h;
  // Bullet color
  var lis=teachBox.querySelectorAll('li');
  lis.forEach(function(li){
    li.style.cssText='position:relative;padding-left:13px;font-size:12px;color:var(--text);line-height:1.5;margin-bottom:1px';
  });
}

/* --- mode toggle --- */
btns.forEach(function(btn){
  btn.addEventListener('click',function(){
    btns.forEach(function(b){b.classList.remove('on')});
    btn.classList.add('on');
    mode=btn.getAttribute('data-m');
    updateHint();updateTeach();
  });
});

/* --- gain --- */
gainEl.addEventListener('input',function(){
  gain=parseInt(this.value);
  gDisp.innerHTML=gain+'<i>dB</i>';
  updateHint();
});

/* --- drag --- */
(function(){
  var el=document.getElementById('scr');
  var active=false,x0,s0;
  function dn(e){
    active=true;var pt=e.touches?e.touches[0]:e;
    x0=pt.clientX;s0=sweep;e.preventDefault();
  }
  function mv(e){
    if(!active)return;var pt=e.touches?e.touches[0]:e;
    var dx=pt.clientX-x0,w=el.getBoundingClientRect().width;
    sweep=Math.max(-4,Math.min(4,s0+(dx/w)*8));
    e.preventDefault();
  }
  function up(){active=false}
  el.addEventListener('mousedown',dn);
  el.addEventListener('touchstart',dn,{passive:false});
  window.addEventListener('mousemove',mv);
  window.addEventListener('touchmove',mv,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
})();

/* --- loop --- */
function frame(ts){
  t=ts*.001;
  render();
  requestAnimationFrame(frame);
}
updateHint();updateTeach();
requestAnimationFrame(frame);
})();
</script>
